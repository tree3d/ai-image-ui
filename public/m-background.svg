    <polygon points="1482,142 1538,142 1538,198 1482,198" fill="#06050b"/>
    <polygon points="1768,268 1818,250 1840,302 1790,322" fill="#8dff26"/>
    <polygon points="1958,420 2028,420 2028,490 1958,490" fill="#05040a"/>
    <polygon points="1568,848 1612,824 1638,868 1594,894" fill="#8dff26"/>
    <polygon points="1238,986 1298,986 1298,1046 1238,1046" fill="#06050b"/>
