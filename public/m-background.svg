    <polygon points="120,790 266,664 500,190 604,208 590,734 898,246 1014,286 966,916 862,936 878,426 622,826 518,802 520,298 260,830" fill="url(#lime)" opacity="0.94"/>
    <polygon points="270,666 500,190 574,206 350,704" fill="#ddff6c" opacity="0.56"/>
    <polygon points="600,724 898,246 970,268 674,756" fill="#ddff6c" opacity="0.5"/>
